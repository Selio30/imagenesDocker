services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb-app
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - NC_TOOL_DIR=/usr/app/data
      - NC_REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/usr/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./redis:/data
    restart: unless-stopped