services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    network_mode: host
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_FILE=false
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"